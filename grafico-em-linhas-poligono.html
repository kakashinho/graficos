<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polígono de Frequências - Configuração Limpa</title>

<style>
    :root {
        /* =========================================================
           📐 ESTRUTURA BASE (Não precisa mexer aqui, use o JS no final)
           ========================================================= */
        --largura-grafico: 1000px;
        --altura-grafico: 600px;
        --margem-interna: 30px;
        --cor-fundo-pagina: #eeeeee;

        /* Variáveis dinâmicas que o JavaScript vai preencher */
        --cor-texto: #000000;
        --peso-fonte: bold;
        --escala-fonte: 1; 
        --espessura-linha: 3px;
        --cor-linha: #d32840;
        --tamanho-ponto: 8px; 
        --cor-ponto: #d32840;
        --cor-grade: rgba(255, 255, 255, 0.8);
        --cor-eixo: #888888;

        /* Tipografia calculada dinamicamente */
        --fonte-principal: "Segoe UI", Arial, sans-serif;
        --tamanho-titulo: calc(24px * var(--escala-fonte));
        --tamanho-titulo-y: calc(14px * var(--escala-fonte));
        --tamanho-valores-y: calc(12px * var(--escala-fonte));
        --tamanho-titulo-x: calc(14px * var(--escala-fonte));
        --tamanho-valores-x: calc(12px * var(--escala-fonte));
        --tamanho-valor-ponto: calc(14px * var(--escala-fonte));
        --tamanho-fonte: calc(12px * var(--escala-fonte));

        /* Espaçamentos do Grid */
        --largura-titulo-y: 45px;
        --largura-valores-y: 45px;
        --espaco-y-grafico: 10px;
        --altura-titulo: auto; 
        --espaco-titulo-grafico: 30px; 
        --altura-plotagem: 350px;
        --altura-valores-x: 35px;
        --altura-titulo-x: 35px;
        --altura-rodape: 35px;
    }

    /* =========================================================
       🎨 12 PALETAS DE CORES DISPONÍVEIS
       ========================================================= */
    /* Cores Vibrantes (Gradientes) */
    .paleta-azul { --cor-fundo-grafico: linear-gradient(180deg, #8ad1ef 0%, #3bb0df 100%); }
    .paleta-roxa { --cor-fundo-grafico: linear-gradient(180deg, #c38aef 0%, #8b3bdf 100%); }
    .paleta-verde { --cor-fundo-grafico: linear-gradient(180deg, #8aefb2 0%, #3bdf74 100%); }
    .paleta-laranja { --cor-fundo-grafico: linear-gradient(180deg, #efcd8a 0%, #df993b 100%); }
    .paleta-vermelha { --cor-fundo-grafico: linear-gradient(180deg, #ef8a8a 0%, #df3b3b 100%); }
    .paleta-rosa { --cor-fundo-grafico: linear-gradient(180deg, #ef8ad5 0%, #df3ba6 100%); }
    .paleta-amarela { --cor-fundo-grafico: linear-gradient(180deg, #f7f1a3 0%, #e6d822 100%); }
    .paleta-pastel { --cor-fundo-grafico: #f4f1de; --cor-grade: #e07a5f; --cor-texto: #3d405b; }
    .paleta-escura { --cor-fundo-grafico: linear-gradient(180deg, #5d6d7e 0%, #2e4053 100%); --cor-texto: #ffffff; }
    .paleta-neon { --cor-fundo-grafico: #111111; --cor-grade: #39ff14; --cor-texto: #0ff; }
    .paleta-clara { --cor-fundo-grafico: #ffffff; --cor-grade: #dddddd; --cor-texto: #333333; }
    .paleta-monocromatica { --cor-fundo-grafico: linear-gradient(180deg, #e0e0e0 0%, #9e9e9e 100%); --cor-texto: #222222; }

    /* =========================================================
       ESTRUTURA CSS (Layout)
       ========================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--fonte-principal); }
    body { background: var(--cor-fundo-pagina); min-height: 100vh; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; padding: 40px; }

    .chart-container {
        zoom: var(--escala, 1);
        width: var(--largura-grafico); 
        min-height: var(--altura-grafico);
        height: auto; 
        background: var(--cor-fundo-grafico);
        display: grid;
        grid-template-columns: var(--largura-titulo-y) var(--largura-valores-y) 1fr 25px;
        grid-template-rows: var(--altura-titulo) var(--altura-plotagem) var(--altura-valores-x) var(--altura-titulo-x) var(--altura-rodape);
        grid-template-areas:
            ".      .      titulo titulo"
            "e-y-t  e-y-n  plot   plot"
            ".      .      x-n    x-n"
            ".      .      x-t    x-t"
            "rodape rodape rodape rodape";
        padding: var(--margem-interna);
        box-shadow: 0 5px 18px rgba(0,0,0,.15);
        border: 1px solid rgba(0,0,0,0.1);
        color: var(--cor-texto);
        font-weight: var(--peso-fonte);
    }

    .area-titulo { grid-area: titulo; display: flex; align-items: center; justify-content: center; text-align: center; font-size: var(--tamanho-titulo); margin-top: 10px; margin-bottom: var(--espaco-titulo-grafico); line-height: 1.3; }
    .area-titulo-y { grid-area: e-y-t; display: flex; justify-content: center; align-items: center; }
    .area-titulo-y span { transform: rotate(-90deg); white-space: nowrap; font-size: var(--tamanho-titulo-y); letter-spacing: 1px;}
    .area-valores-y { grid-area: e-y-n; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding-right: var(--espaco-y-grafico); padding-top: 5px; font-size: var(--tamanho-valores-y); }
    .area-titulo-x { grid-area: x-t; display: flex; align-items: center; justify-content: center; font-size: var(--tamanho-titulo-x); letter-spacing: 1px;}
    .area-rodape { grid-area: rodape; display: flex; align-items: flex-end; padding-left: 15px; font-size: var(--tamanho-fonte); }

    .area-plotagem { grid-area: plot; position: relative; border-left: 1px solid var(--cor-eixo); border-bottom: 1px solid var(--cor-eixo); overflow: visible; margin-right: 30px; }
    .linhas-grade { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .linha { width: 100%; height: 1px; background: var(--cor-grade); }
    .linha:last-child { background: var(--cor-eixo); }
    
    .area-valores-x { grid-area: x-n; position: relative; margin-right: 30px; }
    .pos-x { position: absolute; top: 10px; transform: translateX(-50%); font-size: var(--tamanho-valores-x); }

    .camada-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; z-index: 10; }
    .rotulos-dados { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
    
    .ponto-grafico {
        position: absolute;
        width: var(--tamanho-ponto);
        height: var(--tamanho-ponto);
        background-color: var(--cor-ponto);
        /* border: 2px solid #fff;  */
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 15;
    }

    .valor-rotulo-ponto { 
        position: absolute; 
        transform: translate(-50%, -100%); 
        font-size: var(--tamanho-valor-ponto); 
        margin-top: calc(-6px - (var(--tamanho-ponto) / 2)); 
        white-space: nowrap; 
    }
</style>
</head>

<body>

<!-- Container onde o gráfico será desenhado -->
<div id="grafico-1" class="chart-container"></div>

<script>
/**
 * LÓGICA DO GRÁFICO (Não precisa alterar nada nesta função)
 */
function criarPoligono(containerId, configuracao) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const paleta = configuracao.paletaDeCores ? `paleta-${configuracao.paletaDeCores}` : 'paleta-azul';
    container.classList.add(paleta);

    if (configuracao.escalaTamanhoGrafico) container.style.setProperty('--escala', configuracao.escalaTamanhoGrafico);
    if (configuracao.corDoTexto) container.style.setProperty('--cor-texto', configuracao.corDoTexto);
    if (configuracao.usarNegritoNoTexto !== undefined) container.style.setProperty('--peso-fonte', configuracao.usarNegritoNoTexto ? 'bold' : 'normal');
    if (configuracao.tamanhoDaFonteGeral) container.style.setProperty('--escala-fonte', configuracao.tamanhoDaFonteGeral);
    if (configuracao.corDasLinhasDeFundo) container.style.setProperty('--cor-grade', configuracao.corDasLinhasDeFundo);
    if (configuracao.corDaLinhaDoGrafico) container.style.setProperty('--cor-linha', configuracao.corDaLinhaDoGrafico);
    if (configuracao.espessuraDaLinhaDoGrafico) container.style.setProperty('--espessura-linha', `${configuracao.espessuraDaLinhaDoGrafico}px`);
    if (configuracao.corDosCirculos) container.style.setProperty('--cor-ponto', configuracao.corDosCirculos);
    if (configuracao.tamanhoDosCirculos) container.style.setProperty('--tamanho-ponto', `${configuracao.tamanhoDosCirculos}px`);

    const marcacoesY = configuracao.eixoY.marcacoes.map(v => `<span>${v}</span>`).join('');
    const linhasGrade = configuracao.eixoY.marcacoes.map(() => `<div class="linha"></div>`).join('');

    let polylinePoints = "";
    let rotulosHTML = "";
    let pontosHTML = "";

    const posicoesX = configuracao.eixoX.map((rotulo, i) => {
        const pctX = (i / (configuracao.eixoX.length - 1)) * 100;
        const valor = configuracao.dados[i];
        const pctY = 100 - ((valor / configuracao.eixoY.maximo) * 100);
        
        polylinePoints += `${pctX},${pctY} `;
        pontosHTML += `<div class="ponto-grafico" style="left: ${pctX}%; top: ${pctY}%;"></div>`;
        rotulosHTML += `<div class="valor-rotulo-ponto" style="left: ${pctX}%; top: ${pctY}%;">${valor}</div>`;

        return `<div class="pos-x" style="left: ${pctX}%">${rotulo}</div>`;
    }).join('');

    container.innerHTML = `
        <div class="area-titulo">${configuracao.titulo}</div>
        <div class="area-titulo-y"><span>${configuracao.tituloEixoY}</span></div>
        <div class="area-valores-y">${marcacoesY}</div>
        
        <div class="area-plotagem">
            <div class="linhas-grade">${linhasGrade}</div>
            
            <svg class="camada-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <polyline 
                    points="${polylinePoints.trim()}" 
                    fill="none" 
                    stroke="var(--cor-linha)" 
                    stroke-width="var(--espessura-linha)" 
                    vector-effect="non-scaling-stroke" 
                />
            </svg>
            
            <div class="rotulos-dados">
                ${pontosHTML}
                ${rotulosHTML}
            </div>
        </div>
        
        <div class="area-valores-x">${posicoesX}</div>
        <div class="area-titulo-x">${configuracao.tituloEixoX}</div>
        <div class="area-rodape">${configuracao.fonte}</div>
    `;
}

criarPoligono("grafico-1", {
    escalaTamanhoGrafico: 0.8,  

    paletaDeCores: "azul", 
    usarNegritoNoTexto: true,
    tamanhoDaFonteGeral: 1.5,
    corDoTexto: "#1a1a1a",
    corDasLinhasDeFundo: "rgba(255, 255, 255, 0.9)",
    espessuraDaLinhaDoGrafico: 4,
    corDaLinhaDoGrafico: "#d32840",
    tamanhoDosCirculos: 8,
    corDosCirculos: "#a91629",
    titulo: "Idades de 13 alunos do 4º DSM,<br>Fatec-SJC, 07/08/2026",
    tituloEixoX: "IDADES", 
    tituloEixoY: "NÚMERO DE ALUNOS", 
    fonte: "Fonte: Profa. Nanci de Oliveira.",
    dados: [0, 9, 2, 0, 1, 1, 0], 
    eixoX: ["17,5", "20,5", "23,5", "26,5", "29,5", "32,5", "35,5"], 
    eixoY: { maximo: 10, marcacoes: [10, 8, 6, 4, 2, 0]}
});
</script>

</body>
</html>
